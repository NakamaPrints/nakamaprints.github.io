<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nakama Prints · QR cards</title>
  <link rel="icon" href="assets/np-logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&family=Luckiest+Guy&family=Press+Start+2P&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
  <style>
    :root { --ink: #0c0c0c; --pink: #d72d6b; --line: #d9d9de; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Chakra Petch', system-ui, sans-serif; color: var(--ink); background: #f3f3f5; }
    .controls { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    .controls h1 { font-family: 'Press Start 2P', monospace; font-size: 18px; font-weight: 400; margin: 0 0 8px; }
    .controls p { margin: 0 0 16px; color: #45454c; line-height: 1.5; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin-bottom: 14px; }
    label { display: grid; gap: 4px; font-weight: 700; font-size: 13px; }
    input { font: inherit; padding: 10px 12px; border: 2px solid var(--ink); background: #fff; }
    input[type=url] { width: min(560px, 100%); }
    input[type=number] { width: 90px; }
    button { font: inherit; font-weight: 700; padding: 11px 20px; border: 0; color: #fff; background: var(--pink); cursor: pointer; }
    .warn { color: #a81f50; font-weight: 700; }

    .sheet { display: flex; flex-wrap: wrap; gap: 6mm; justify-content: center; padding: 8mm; background: #fff; max-width: 210mm; margin: 0 auto 40px; }
    .slot { display: grid; gap: 2mm; justify-items: center; }
    /* "Who's that Pokémon?" card: orange sunburst, halftone dots, yellow lettering with a blue outline */
    .card {
      --yellow: #ffcb05; --blue: #2a5ab0; --blue-deep: #1a3a80;
      width: 50mm; height: 70mm; padding: 4.5mm 4mm 3.5mm; border-radius: 3mm; overflow: hidden;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      background:
        radial-gradient(circle, rgba(255,255,255,0.24) 0.26mm, transparent 0.3mm) 0 0 / 1.4mm 1.4mm,
        radial-gradient(circle at 50% 26%, rgba(255,226,120,0.75), transparent 38%),
        radial-gradient(circle at 50% 40%, transparent 55%, rgba(214,38,24,0.6) 100%),
        repeating-conic-gradient(from 0deg at 50% 26%, #ff641a 0deg 6deg, #ff8f30 6deg 12deg);
      outline: 0.2mm dashed #bbb; outline-offset: 1mm;
      -webkit-print-color-adjust: exact; print-color-adjust: exact;
    }
    .pk {
      font-family: 'Luckiest Guy', 'Chakra Petch', sans-serif; color: var(--yellow); line-height: 0.95;
      -webkit-text-stroke: 1.5mm var(--blue); paint-order: stroke fill;
      text-shadow: 0 0.7mm 0 var(--blue-deep);
    }
    .card .title { display: grid; justify-items: center; margin-top: 0.5mm; }
    .card .line1 { display: flex; align-items: center; gap: 2.2mm; font-size: 12pt; }
    .card .line1 .q { font-size: 16pt; line-height: 1; color: var(--blue); -webkit-text-stroke: 1.1mm var(--yellow); text-shadow: 0 0.6mm 0 var(--blue-deep); transform: rotate(8deg); }
    .card .line2 { font-size: 22pt; letter-spacing: 0.02em; margin-top: 1mm; }
    .card .qr {
      width: 31mm; height: 31mm; padding: 1.4mm; background: #fff; border-radius: 2mm;
      border: 0.9mm solid var(--blue); box-shadow: 0 0.8mm 0 var(--blue-deep);
    }
    .card .qr svg { width: 100%; height: 100%; display: block; }
    .card .foot { display: flex; align-items: center; justify-content: center; gap: 1.6mm; width: 100%; }
    .card .foot img { width: 6.5mm; filter: drop-shadow(0 0.4mm 0 rgba(0,0,0,0.35)); }
    .card .foot .scan { font-size: 11pt; -webkit-text-stroke: 1.1mm var(--blue); text-shadow: 0 0.5mm 0 var(--blue-deep); }
    .tag { font-size: 8pt; color: #888; }

    @media print {
      @page { size: A4; margin: 8mm; }
      body { background: #fff; }
      .controls { display: none; }
      .sheet { padding: 0; margin: 0; max-width: none; }
      .slot { break-inside: avoid; }
    }
  </style>
</head>
<body>
  <div class="controls">
    <h1>QR cards</h1>
    <p>One card goes inside each Pokeball. All cards look the same, so the surprise stays hidden. The label under each card
       (cut it off) tells you which creature it opens. Print at 100% / actual size.</p>
    <div class="row">
      <label>Link to your live AR page (GitHub Pages)
        <input type="url" id="base" placeholder="https://yourname.github.io/nakama-ar/" />
      </label>
    </div>
    <div class="row" id="counts"></div>
    <div class="row"><button id="print">Print cards</button></div>
    <p class="warn" id="warn" hidden></p>
  </div>
  <div class="sheet" id="sheet"></div>

  <script src="js/sprites-data.js"></script>
  <script>
    const S = window.NAKAMA_SPRITES;
    const $ = id => document.getElementById(id);
    const counts = {};

    // default base = the folder this page is served from
    const here = location.href.split(/[?#]/)[0].replace(/[^/]*$/, '');
    $('base').value = here;

    for (const id of Object.keys(S)) {
      counts[id] = 3;
      const l = document.createElement('label');
      l.innerHTML = `${S[id].name}<input type="number" min="0" max="40" value="3" data-id="${id}" />`;
      $('counts').appendChild(l);
    }

    function qrSvg(text) {
      const qr = qrcode(0, 'M');
      qr.addData(text);
      qr.make();
      const n = qr.getModuleCount(), q = 2;
      let d = '';
      for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) d += `M${c + q} ${r + q}h1v1h-1z`;
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + q * 2} ${n + q * 2}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#0c0c0c"/></svg>`;
    }

    function render() {
      let base = $('base').value.trim();
      if (base && !base.endsWith('/') && !/\.html$/.test(base)) base += '/';
      const bad = !/^https:\/\//.test(base) || /localhost|127\.0\.0\.1/.test(base);
      $('warn').hidden = !bad;
      $('warn').textContent = 'Heads up: this link isn\'t a public https address, so phones won\'t be able to open it. Put in your GitHub Pages link before printing.';

      const sheet = $('sheet');
      sheet.innerHTML = '';
      for (const id of Object.keys(S)) {
        const svg = qrSvg(base + '?c=' + id);
        for (let i = 0; i < counts[id]; i++) {
          const slot = document.createElement('div');
          slot.className = 'slot';
          slot.innerHTML = `
            <div class="card">
              <div class="title">
                <div class="line1 pk"><span>Who's</span><span class="q">?</span><span>That</span></div>
                <div class="line2 pk">Pokémon</div>
              </div>
              <div class="qr">${svg}</div>
              <div class="foot"><img src="assets/np-logo.png" alt="Nakama Prints" /><span class="scan pk">Scan me!</span></div>
            </div>
            <div class="tag">${S[id].name} · cut off</div>`;
          sheet.appendChild(slot);
        }
      }
    }

    $('base').addEventListener('input', render);
    $('counts').addEventListener('input', e => {
      if (e.target.dataset.id) { counts[e.target.dataset.id] = Math.max(0, Math.min(40, +e.target.value || 0)); render(); }
    });
    $('print').addEventListener('click', () => window.print());
    render();
  </script>
</body>
</html>
