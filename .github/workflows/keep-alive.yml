# Weekly ping so the free Supabase project never pauses (it pauses after ~7 days without activity).
# Lives in the site repo as .github/workflows/keep-alive.yml. Uses only the public publishable key.
name: Keep the Pokédex awake

on:
  schedule:
    - cron: '17 3 * * 1,4'   # Mondays and Thursdays, 03:17 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row from the database
        run: |
          curl --fail --silent --show-error \
            -H "apikey: sb_publishable_SO4U0DtPq4Hyeuqe7dyysg_GzdxwIRC" \
            "https://ifjczxrmvrnofgxjujpu.supabase.co/rest/v1/pokemon?select=dex&limit=1"
